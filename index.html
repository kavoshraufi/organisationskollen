<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Prov kapitel 1–3 · Ledarskap och organisation</title>
<style>
:root{
 --teal:#36A1B2;--teal-d:#1C6976;--teal-dd:#124a53;--teal-l:#E4F4F7;
 --pink:#D6336C;--pink-d:#A81E4E;--pink-l:#FCE9F0;
 --yel:#F6C343;--yel-d:#6E5000;--yel-l:#FFF5D6;
 --ink:#15232A;--muted:#52636B;--line:#D9E5E9;--bg:#F3F8F9;--card:#fff;
 --ok:#1D7A49;--okbg:#E3F5EB;--bad:#B3243A;--badbg:#FDECEF;
 --r:18px;--sh:0 1px 2px rgba(18,74,83,.06),0 8px 24px rgba(18,74,83,.08);--sh2:0 2px 4px rgba(18,74,83,.08),0 16px 36px rgba(18,74,83,.14);
 --font:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.55;color:var(--ink);background:
 radial-gradient(1200px 420px at 85% -120px,rgba(214,51,108,.10),transparent 70%),
 radial-gradient(1000px 480px at -10% -160px,rgba(54,161,178,.18),transparent 70%),var(--bg);min-height:100vh}
a{color:var(--teal-d)}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(1.6rem,4.2vw,2.3rem);font-weight:800;color:var(--teal-dd)}
h2{font-size:1.3rem;font-weight:800;color:var(--teal-dd)}
h3{font-size:1.05rem;font-weight:700}
p{margin:.45em 0}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Toppfält */
#bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bi{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;flex:1;min-width:0}
.logo .mk{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-size:1.05rem;background:linear-gradient(135deg,var(--teal),var(--teal-d));box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--teal-l);color:var(--teal-dd);white-space:nowrap;border:0;font-family:inherit}
.chip.mode-prov{background:var(--pink-l);color:var(--pink-d)}
.chip.pts{background:var(--yel);color:#3b2a00}
button.chip{cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:18px 16px 80px}
/* Knappar */
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;transition:transform .12s ease,box-shadow .12s ease,background .2s;min-height:46px}
.btn:active{transform:translateY(2px)}
.btn.pri{background:linear-gradient(180deg,#e04b80,var(--pink-d));color:#fff;box-shadow:0 4px 0 #7f1239,0 8px 18px rgba(214,51,108,.28)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.tea{background:linear-gradient(180deg,#3fb0c1,var(--teal-d));color:#fff;box-shadow:0 4px 0 #0e4149,0 8px 18px rgba(28,105,118,.25)}
.btn.tea:hover{transform:translateY(-1px)}
.btn.sec{background:#fff;color:var(--teal-dd);border:2px solid var(--teal);box-shadow:0 2px 0 rgba(18,74,83,.12)}
.btn.sec:hover{background:var(--teal-l)}
.btn.ghost{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.btn.sm{padding:8px 14px;font-size:.92rem;min-height:38px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Kort */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:stretch;margin-bottom:18px}
.hero .intro{padding:22px}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-d)}
.lead{color:var(--muted);font-size:1.02rem}
.field{display:flex;flex-direction:column;gap:5px;margin:14px 0 4px}
.field label{font-weight:700;font-size:.92rem}
input[type=text],textarea{font:inherit;color:var(--ink);padding:11px 13px;border:2px solid #b9cdd3;border-radius:12px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(54,161,178,.2)}
textarea{min-height:140px;resize:vertical}
.seg{display:inline-flex;background:#EAF2F4;border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:11px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;min-height:42px}
.seg button[aria-pressed=true]{background:#fff;color:var(--teal-dd);box-shadow:0 2px 6px rgba(18,74,83,.15)}
.seg.pink button[aria-pressed=true]{color:var(--pink-d)}.seg button.good[aria-pressed=true]{background:var(--ok);color:#fff}.seg button.badp[aria-pressed=true]{background:var(--bad);color:#fff}.seg button:disabled{cursor:default}
.modeinfo{font-size:.92rem;color:var(--muted);margin-top:6px}
.overall{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:22px;background:linear-gradient(160deg,#fff 30%,var(--teal-l))}
.lvl{font-weight:800;color:var(--teal-dd)}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .bg{stroke:#E3ECEF}
.ring .fg{stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--teal-dd);line-height:1.1}
.ring .num small{font-weight:600;color:var(--muted);font-size:.72rem}
/* Kapitel */
.chgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ch{--c:var(--teal);--cd:var(--teal-dd);--cl:var(--teal-l);padding:0;overflow:hidden;display:flex;flex-direction:column;animation:rise .45s both}
.ch.pink{--c:var(--pink);--cd:var(--pink-d);--cl:var(--pink-l)}
.ch.yellow{--c:var(--yel);--cd:var(--yel-d);--cl:var(--yel-l)}
.chhead{padding:16px 16px 12px;background:linear-gradient(135deg,var(--cl),#fff 75%);border-bottom:1px solid var(--line)}
.chnum{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cd)}
.chnum i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.chhead h2{font-size:1.08rem;margin:4px 0 10px;color:var(--ink)}
.pbar{height:10px;border-radius:99px;background:#E6EEF0;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px;gap:8px}
.exlist{list-style:none;margin:0;padding:8px}
.exlist a{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;text-decoration:none;color:var(--ink);transition:background .15s,transform .15s}
.exlist a:hover{background:var(--cl);transform:translateX(3px)}
.exico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--cl);font-size:1.15rem;flex:none}
.exl{flex:1;min-width:0}
.ext{font-weight:700;font-size:.95rem;line-height:1.25}
.ext{display:block}.exm{display:inline-block;font-size:.8rem;color:var(--muted);margin-right:8px}.exs{display:inline-flex;align-items:center;gap:6px;margin-top:3px}.exlist .go{font-size:1.4rem;color:#9fb3b9;transition:transform .15s}.exlist a:hover .go{transform:translateX(3px);color:var(--cd)}
.st{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#EEF3F4;color:var(--muted);white-space:nowrap}
.st.done{background:var(--okbg);color:var(--ok)}
.st.part{background:var(--yel-l);color:var(--yel-d)}
.stars{color:#E0A800;letter-spacing:1px;font-size:.9rem;white-space:nowrap}.stars .off{color:#CFD9DC}
.panel{margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.note{background:var(--yel-l);border:1px solid #F2DD9A;color:#4d3a00;border-radius:14px;padding:12px 14px;font-size:.95rem}
.note.pink{background:var(--pink-l);border-color:#F4C2D3;color:#6b1533}
/* Övning */
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:800;border-radius:99px;padding:4px 11px;background:var(--teal-l);color:var(--teal-dd)}
.tag.pink{background:var(--pink-l);color:var(--pink-d)}.tag.yellow{background:var(--yel-l);color:var(--yel-d)}
.tag.kind{background:#fff;border:1px solid var(--line);color:var(--muted)}
.exhead{margin-bottom:12px}
.prog{display:flex;align-items:center;gap:12px;margin:12px 0}
.prog .pbar{flex:1}
.prog .pt{font-size:.88rem;color:var(--muted);white-space:nowrap;font-weight:600}
.instr{color:var(--muted)}
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(18,74,83,.05);transition:border-color .25s,background .25s;animation:rise .35s both}
.q.ok{border-color:#9fd4b5;background:linear-gradient(180deg,var(--okbg),#fff 70%)}
.q.no{border-color:#efb3bd;background:linear-gradient(180deg,var(--badbg),#fff 70%)}
.qt{display:flex;gap:11px;font-weight:700;margin-bottom:10px}
.qn{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--teal-dd);color:#fff;font-size:.88rem;font-weight:800}
.q.ok .qn{background:var(--ok)}.q.no .qn{background:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin:7px 0;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:#9ccbd3;background:#F7FBFC}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.opt input{margin-top:4px;accent-color:var(--teal-d);width:18px;height:18px;flex:none}
.opt.right,.opt.right:has(input:checked){border-color:var(--ok);background:var(--okbg);font-weight:700}.opt.right:after{content:'✓';margin-left:auto;color:var(--ok);font-weight:800}
.opt.wrongpick,.opt.wrongpick:has(input:checked){border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.opt.dis{cursor:default}
.fb{margin-top:10px;font-size:.95rem;padding:10px 12px;border-radius:12px;background:#F4F8F9;border-left:4px solid var(--teal)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb b.v{font-weight:800}.fb.ok b.v{color:var(--ok)}.fb.no b.v{color:var(--bad)}
.txtrow{display:flex;gap:8px;flex-wrap:wrap}.txtrow input{flex:1;min-width:180px;max-width:460px}
/* Matcha */
.rnd{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--teal-dd);margin:20px 0 8px}
.rnd:before{content:"";width:8px;height:22px;border-radius:4px;background:var(--pink)}
.mx{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px 18px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcol h4{margin:0 0 2px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mt,.md{font:inherit;text-align:left;padding:11px 12px;border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;min-height:48px}
.mt{font-weight:700}
.mt:hover,.md:hover{border-color:#9ccbd3}
.mt[aria-pressed=true]{border-color:var(--pink);background:var(--pink-l);transform:translateX(4px);box-shadow:0 0 0 4px rgba(214,51,108,.15)}
.lt{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.85rem;font-weight:800;background:#EEF3F4;color:var(--muted)}
.linked .lt{background:var(--lc);color:#fff}
.mt.linked,.md.linked{border-color:var(--lc)}
.md .lt.empty{background:transparent;border:2px dashed #c6d6da}
.mt.ok,.md.ok{border-color:var(--ok);background:var(--okbg)}
.mt.no,.md.no{border-color:var(--bad);background:var(--badbg)}
.mt:disabled,.md:disabled{cursor:default}
/* Ordna */
.olist{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.oi{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:13px;padding:8px 8px 8px 10px;transition:transform .2s,border-color .2s,background .2s}
.oi .pos{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--teal-l);color:var(--teal-dd)}
.oi .tx{flex:1}
.oi .mv{display:flex;gap:6px}
.iconbtn{font:inherit;width:42px;height:42px;border-radius:11px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:1rem;color:var(--teal-dd);display:grid;place-items:center;transition:background .15s,border-color .15s}
.iconbtn:hover{background:var(--teal-l);border-color:var(--teal)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.oi.ok{border-color:var(--ok);background:var(--okbg)}.oi.no{border-color:var(--bad);background:var(--badbg)}
.oi.moved{animation:nudge .35s}
.olab{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* Sortera */
.si{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:13px;padding:9px 10px;margin:7px 0;transition:border-color .2s,background .2s}
.si .tx{flex:1 1 220px;font-weight:600}
.si.ok{border-color:var(--ok);background:var(--okbg)}.si.no{border-color:var(--bad);background:var(--badbg)}
.si .hint{flex-basis:100%;font-size:.88rem;color:var(--bad);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font:inherit;font-size:.9rem;font-weight:700;padding:7px 12px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;min-height:40px;transition:all .15s}
.cat:hover{border-color:#9ccbd3}
.cat[aria-pressed=true]{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
.cat:disabled{cursor:default}
.bucket{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.bucket span{font-size:.82rem;font-weight:700;background:var(--teal-l);color:var(--teal-dd);padding:3px 10px;border-radius:99px}
/* Sant/falskt */
.tfs{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.tfw{margin-top:10px;font-size:.92rem;font-weight:700;color:var(--muted)}
/* Skriv */
.wc{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
.model{background:linear-gradient(180deg,var(--teal-l),#fff);border:1px solid #bfe2e8;border-left:5px solid var(--teal);padding:12px 14px;border-radius:12px;margin:12px 0;font-size:.97rem}
.model b{color:var(--teal-dd)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;margin:4px 0;border:1px solid transparent}
.chk:hover{background:#F4F8F9}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
.chk:has(input:checked){background:var(--okbg);border-color:#bfe3cd}
.lvlt{font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--yel-l);color:var(--yel-d);margin-left:6px;vertical-align:middle}
/* Resultat */
.res{display:flex;gap:18px;align-items:center;flex-wrap:wrap;animation:rise .45s both}
.res h2{margin-bottom:2px}
.newbest{display:inline-block;margin-top:6px;background:var(--yel);color:#3b2a00;font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:99px}
.rep{margin-top:8px;font-size:.92rem}
.rep a{font-weight:700}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.rhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700}
.chres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.chres .card{--c:var(--teal)}
.chres .pink{--c:var(--pink)}.chres .yellow{--c:var(--yel)}
.big{font-size:1.6rem;font-weight:800;color:var(--teal-dd)}
.tlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:grid;grid-template-columns:1fr 120px auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tl{font-weight:700}.tl small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.badge{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;text-align:center}
.badge.s{background:var(--okbg);color:var(--ok)}.badge.m{background:var(--yel-l);color:var(--yel-d)}.badge.w{background:var(--badbg);color:var(--bad)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pill{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:99px;font-size:.88rem;font-weight:700}
.pill.s{background:var(--okbg);color:var(--ok)}.pill.w{background:var(--badbg);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--teal-dd);color:#fff;font-weight:700;padding:11px 18px;border-radius:14px;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall 2.4s linear forwards}
details.copy{margin-top:12px}details.copy pre{white-space:pre-wrap;background:#F4F8F9;border-radius:12px;padding:12px;font-size:.88rem}
footer.foot{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media(max-width:820px){.hero{grid-template-columns:1fr}.chgrid,.chres{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}}
@media(max-width:560px){body{font-size:16px}#app{padding:14px 12px 70px}.logo small,.chip.hide-s{display:none}
 .mx{grid-template-columns:1fr}.tlist li{grid-template-columns:1fr auto}.tlist li .pbar{grid-column:1/-1;order:3}.rhead{grid-template-columns:1fr;justify-items:center;text-align:center}.card{padding:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
 body{background:#fff;font-size:12pt}#bar,.noprint,.nav,#toast,footer.foot,details.copy{display:none!important}
 .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}#app{padding:0;max-width:none}
 .chres{grid-template-columns:repeat(3,1fr)}.tlist li{break-inside:avoid}
 .pbar{border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pbar>span,.badge,.ring{-webkit-print-color-adjust:exact;print-color-adjust:exact}

var DATA={"chapters": [{"n": 1, "title": "Organisation och ledarskap i en föränderlig värld", "color": "teal"}, {"n": 2, "title": "Den ansvarstagande organisationen", "color": "pink"}, {"n": 3, "title": "Organisationer förr och nu", "color": "yellow"}], "topics": {"k1-vms": {"label": "Vision, mål och strategi", "ch": 1}, "k1-smart": {"label": "SMART och mätbara mål", "ch": 1}, "k1-liv": {"label": "Livscykel, förnyelse och nedgång", "ch": 1}, "k1-strat": {"label": "Strategi och förändring", "ch": 1}, "k2-int": {"label": "Intressenter och intressentmodellen", "ch": 2}, "k2-csr": {"label": "CSR och hållbar utveckling", "ch": 2}, "k2-ansvar": {"label": "Förtroende och ansvar: license to operate, Enron, H&M", "ch": 2}, "k2-etik": {"label": "Etik och etiskt ledarskap", "ch": 2}, "k3-hist": {"label": "Smith, Weber, Taylor och massproduktionen", "ch": 3}, "k3-byr": {"label": "Den byråkratiska modellen", "ch": 3}, "k3-krit": {"label": "Kritiken mot byråkratin", "ch": 3}, "k3-org": {"label": "Den organiska modellen och hybrider", "ch": 3}}, "ex": [{"id": "k1-match", "ch": 1, "kind": "match", "title": "Matcha: vision, strategi och förändring", "desc": "Begrepp om vision, livscykel och förändring.", "rounds": [{"pairs": [["Vision", "En långsiktig bild av ett önskat framtida läge som ska inspirera och motivera.", "k1-vms"], ["Mål", "Konkreta delsteg på vägen mot visionen, helst mätbara.", "k1-vms"], ["Strategi", "Planen för hur målen ska nås, vägen från nuläget till målet.", "k1-vms"], ["Livscykel", "Introduktion, tillväxt, mognad och förnyelse eller nedgång.", "k1-liv"], ["Stagnera", "Stå still och sluta utvecklas.", "k1-liv"]], "title": "Omgång 1"}, {"pairs": [["Dynamisk förmåga", "Förmågan att anpassa sig och ändra sig efter nya förhållanden.", "k1-strat"], ["Improvisera", "Hitta lösningar utan en färdig plan.", "k1-strat"], ["Deadline", "Tidpunkten då ett mål ska vara uppnått.", "k1-smart"], ["Synkad", "I takt med, till exempel med omvärldens förändringar.", "k1-strat"]], "title": "Omgång 2"}]}, {"id": "k1-order", "ch": 1, "kind": "order", "title": "Ordna: livscykeln och SMART", "desc": "Livscykelns faser och SMART i rätt ordning.", "rounds": [{"prompt": "Ordna livscykelns fyra faser från första till sista.", "first": "Först", "last": "Sist", "items": [["Introduktion", "k1-liv"], ["Tillväxt", "k1-liv"], ["Mognad", "k1-liv"], ["Förnyelse eller nedgång", "k1-liv"]]}, {"prompt": "Ordna kraven så att de bildar ordet SMART.", "first": "S", "last": "T", "items": [["Specifikt: tydligt vad som ska uppnås", "k1-smart"], ["Mätbart: man bestämmer direkt hur målet mäts", "k1-smart"], ["Accepterat av dem som ska uppnå det", "k1-smart"], ["Realistiskt: möjligt att nå", "k1-smart"], ["Tidsbundet: målet har en deadline", "k1-smart"]]}]}, {"id": "k1-sort", "ch": 1, "kind": "sort", "title": "Sortera: vision, mål eller strategi?", "desc": "Vision, mål och strategi samt fallen.", "rounds": [{"prompt": "Hör beskrivningen till vision, mål eller strategi?", "cats": ["Vision", "Mål", "Strategi"], "items": [["Svarar på frågan: vart vill vi på längre sikt?", 0, "k1-vms"], ["Ska inspirera och skapa samhörighet men är ofta inte mätbar", 0, "k1-vms"], ["Klarnas dröm om säkrare, enklare och roligare nätshopping", 0, "k1-vms"], ["Svarar på frågan: vad ska vi uppnå?", 1, "k1-vms"], ["Konkreta delsteg som helst ska vara SMART", 1, "k1-vms"], ["Riksdagens överskottsmål på 1 % av BNP över en konjunkturcykel", 1, "k1-smart"], ["Svarar på frågan: hur ska vi nå målen?", 2, "k1-vms"], ["Ska vara långsiktig men öppen för justeringar", 2, "k1-strat"]]}, {"prompt": "Visar fallet förnyelse eller nedgång?", "cats": ["Förnyelse", "Nedgång"], "items": [["Lego efter krisen kring år 2000", 0, "k1-liv"], ["Nike efter kritiken mot arbetsförhållanden hos underleverantörer", 0, "k1-liv"], ["Stora under omkring 700 år", 0, "k1-liv"], ["Kodak när fotografin blev digital", 1, "k1-liv"], ["Hultsfredsfestivalen efter de ekonomiska problemen", 1, "k1-liv"]]}]}, {"id": "k1-tf", "ch": 1, "kind": "tf", "title": "Sant eller falskt: förändring och mål", "desc": "Fem påståenden, välj sant eller falskt och rätt motivering.", "items": [{"s": "En vision måste alltid gå att mäta.", "v": false, "topic": "k1-vms", "why": ["Visionen är ofta inte mätbar. Det är målen som helst ska gå att mäta.", "Visionen mäts varje år i bokslutet.", "Utan mätning kan en vision inte inspirera någon."]}, {"s": "Livscykeln är inget öde. Hur det går beror på hur ledningen hanterar situationerna.", "v": true, "topic": "k1-liv", "why": ["Lego och Stora visar att en organisation kan förnya sig i stället för att gå mot nedgång.", "Alla organisationer går ofrånkomligen i konkurs efter mognadsfasen.", "Livscykeln gäller bara privata företag."]}, {"s": "Framgång i dag garanterar framgång i morgon.", "v": false, "topic": "k1-liv", "why": ["Kodak dominerade filmmarknaden men ställde inte om till digital fotografi och ansökte om konkursskydd 2012.", "Stora företag kan aldrig förlora sin marknad.", "Framgång gör det alltid lättare att se nya trender."]}, {"s": "T i SMART står för tidsbundet, alltså att målet har en deadline.", "v": true, "topic": "k1-smart", "why": ["Ett tidsbundet mål anger när det ska vara uppnått.", "Ett tidsbundet mål får ta hur lång tid som helst.", "Tidsbundet betyder att målet bara gäller under arbetstid."]}, {"s": "Henry Mintzberg menar att strategi mest handlar om att i förväg räkna ut allt som ska hända.", "v": false, "topic": "k1-strat", "why": ["Han menar att strategi handlar om att binda samman punkterna, alltså se mönster i det som faktiskt händer.", "Han menar att strategi är onödigt eftersom framtiden är osäker.", "Han menar att strategi bara handlar om ledningens värderingar."]}]}, {"id": "k1-quiz", "ch": 1, "kind": "quiz", "title": "Flerval: livscykel, vision och strategi", "desc": "Nio flervalsfrågor och tre begrepp att skriva.", "items": [{"t": "mc", "q": "Vilka är de fyra faserna i organisationens livscykel?", "opts": ["Introduktion, tillväxt, mognad och förnyelse eller nedgång", "Start, expansion, kris och konkurs", "Idé, planering, genomförande och uppföljning", "Introduktion, mognad, tillväxt och avveckling"], "why": "Livscykeln är inget öde. Hur det går beror på hur ledningen hanterar situationerna.", "topic": "k1-liv"}, {"t": "mc", "q": "Vad är typiskt för mognadsfasen?", "opts": ["Byråkratiseringen kommer och organisationen kan bli trög", "Verksamheten startas", "Organisationen växer utan regler", "All struktur försvinner"], "why": "Efter mognaden måste organisationen förnya sig, annars väntar nedgång.", "topic": "k1-liv"}, {"t": "mc", "q": "Varför gick det illa för Kodak?", "opts": ["Företaget ställde inte om till digital fotografi trots att utvecklingen var känd", "Företaget satsade för tidigt på digitalkameror", "Företaget hade för få kunder från början", "Företaget växte för långsamt i Europa"], "why": "Tidigare framgång kan göra en organisation blind. Kodak ansökte om konkursskydd 2012.", "topic": "k1-liv"}, {"t": "mc", "q": "Hur vände Lego krisen kring år 2000?", "opts": ["En ny ledare gick tillbaka till kärnan", "Lego spred sig till ännu fler verksamheter", "Lego slutade tillverka klossar", "Lego bytte namn och varumärke"], "why": "Krisen kom efter att Lego spridit sig på för mycket. Sedan 2005 har vinsterna vuxit igen.", "topic": "k1-liv"}, {"t": "mc", "q": "Vilken fråga svarar strategin på?", "opts": ["Hur ska vi nå målen?", "Vart vill vi på lång sikt?", "Vad ska vi uppnå?", "Vem ska leda organisationen?"], "why": "Visionen svarar på vart, målen på vad och strategin på hur.", "topic": "k1-vms"}, {"t": "mc", "q": "Vad står A för i SMART?", "opts": ["Accepterat", "Ambitiöst", "Avgränsat", "Anpassat"], "why": "Målet ska accepteras av dem som ska uppnå det.", "topic": "k1-smart"}, {"t": "mc", "q": "Varför är det viktigt att mål är mätbara?", "opts": ["Då går det att följa upp om målet är nått", "Då blir målet alltid lätt att nå", "Då behövs ingen strategi", "Då slipper man en deadline"], "why": "Kvalitet, till exempel i vård och skola, är ändå svår att fånga i siffror.", "topic": "k1-smart"}, {"t": "mc", "q": "Vad menar Henry Mintzberg med att strategi handlar om att binda samman punkterna?", "opts": ["Att se mönster i det som faktiskt händer", "Att följa en färdig plan steg för steg", "Att räkna ut allt i förväg", "Att rita ett organisationsschema"], "why": "Framtiden är osäker, så strategier behöver vara flexibla.", "topic": "k1-strat"}, {"t": "mc", "q": "Vad menade Jack Welch om förändring?", "opts": ["När förändringstakten inne i organisationen är lägre än utanför är slutet nära", "Organisationer bör undvika förändring", "Förändring behövs bara i kris", "Framgång i dag garanterar framgång i morgon"], "why": "Därför är det klokt att förändra sig innan man tvingas.", "topic": "k1-strat"}, {"t": "txt", "q": "Organisationens dröm om framtiden: en långsiktig bild som ska inspirera, men som ofta inte går att mäta.", "a": ["vision", "visionen", "en vision"], "shown": "Vision", "how": "Målen är de konkreta delstegen på vägen mot visionen.", "topic": "k1-vms"}, {"t": "txt", "q": "En modell för bra mål: specifikt, mätbart, accepterat, realistiskt och tidsbundet.", "a": ["smart", "smart-modellen", "smartmodellen", "smart modellen"], "shown": "SMART", "how": "Ett exempel är riksdagens överskottsmål på 1 % av BNP över en konjunkturcykel.", "topic": "k1-smart"}, {"t": "txt", "q": "Att stå still och sluta utvecklas, en risk för den organisation som inte förnyar sig.", "a": ["stagnera", "stagnation", "stagnerar", "att stagnera"], "shown": "Stagnera", "how": "Efter mognadsfasen kommer förnyelse eller nedgång.", "topic": "k1-liv"}]}, {"id": "k1-write", "ch": 1, "kind": "write", "title": "Skriv: från vision till förändring", "desc": "Fem skrivfrågor från kortsvar till resonemang.", "items": [{"q": "Förklara kort vad som menas med vision, mål och strategi för en organisation. Hur hänger de tre begreppen ihop?", "parts": ["Vision: en långsiktig bild av ett önskat framtida läge som ska inspirera och motivera, ofta inte mätbar.", "Mål: konkreta delsteg mot visionen som svarar på vad som ska uppnås, helst mätbara.", "Strategi: planen för hur målen nås, och sambandet vart (vision), vad (mål) och hur (strategi)."], "model": "En vision är en långsiktig bild av ett önskat framtida läge, organisationens dröm om vart den vill. Den är ofta inte mätbar men ska inspirera, motivera och skapa samhörighet, som Kennedys mål att sätta en människa på månen. Mål är konkreta delsteg på vägen mot visionen och svarar på vad organisationen ska uppnå. De ger riktning och energi och bör gå att mäta. Strategin är planen för hur målen ska nås. Sambandet blir: vart vill vi (vision), vad ska vi uppnå (mål) och hur ska vi nå dit (strategi).", "topic": "k1-vms", "level": "Kortsvar"}, {"q": "Ett bra mål ska vara SMART. Vad står de fem bokstäverna för? Förklara kort vad varje krav innebär och varför det är viktigt att ett mål går att mäta.", "parts": ["S och M: specifikt (tydligt vad som ska uppnås) och mätbart (man bestämmer direkt hur målet mäts).", "A, R och T: accepterat av dem som ska nå det, realistiskt att nå och tidsbundet med en deadline.", "Mätbara mål går att följa upp, man ser om målet är nått och hur långt det är kvar."], "model": "S står för specifikt: det ska vara tydligt vad som ska uppnås. M står för mätbart: man bestämmer direkt hur målet ska mätas. A står för accepterat: målet ska accepteras av dem som ska uppnå det. R står för realistiskt: målet ska gå att nå. T står för tidsbundet: målet ska ha en deadline. Mätbara mål går att följa upp, så att man ser om målet är nått och hur långt det är kvar. Kvalitet, till exempel i vård och skola, är däremot svår att fånga i siffror.", "topic": "k1-smart", "level": "Kortsvar"}, {"q": "Beskriv organisationens livscykel och dess fyra faser. Vad riskerar en organisation som inte förnyar sig? Använd ett av fallen Kodak, Lego, Hultsfredsfestivalen, Nike eller Stora som exempel.", "parts": ["De fyra faserna: introduktion, tillväxt, mognad och förnyelse eller nedgång.", "Vad som händer: mer struktur och regler i tillväxten, byråkratisering och tröghet i mognaden.", "Risken: utan förnyelse stagnerar organisationen och går mot nedgång, men livscykeln är inget öde utan beror på ledningen.", "Ett fall som kopplas till livscykeln, till exempel Kodak (nedgång) eller Lego och Stora (förnyelse)."], "model": "Organisationer har liksom människor en livscykel med fyra faser: introduktion, tillväxt, mognad och förnyelse eller nedgång. I tillväxten behövs mer struktur och regler, och i mognaden kommer byråkratiseringen så att organisationen kan bli trög. Sedan måste den förnya sig, annars riskerar den att stagnera och gå mot nedgång. Livscykeln är ändå inget öde, hur det går beror på hur ledningen hanterar situationerna. Kodak dominerade filmmarknaden men ställde inte om till digital fotografi och ansökte om konkursskydd 2012. Lego hamnade i kris kring år 2000 men en ny ledare gick tillbaka till kärnan, och sedan 2005 växer företaget igen.", "topic": "k1-liv", "level": "Förklara"}, {"q": "Henry Mintzberg menar att strategi handlar mer om att binda samman punkterna än om att hitta dem. Förklara vad han menar och varför strategier behöver vara flexibla. Nämn och förklara också två kännetecken på en bra strategi.", "parts": ["Mintzberg: strategi handlar om att se mönster i det som faktiskt händer, snarare än att räkna ut allt i förväg.", "Flexibilitet behövs eftersom framtiden är osäker och förändringstakten ökar, organisationer behöver dynamisk förmåga.", "Ett kännetecken förklarat, till exempel långsiktig men öppen för justeringar, eller samstämmig med vision och mål.", "Ett andra kännetecken förklarat, till exempel synkad med omvärldens förändringar, tar vara på framtida möjligheter eller ger konkurrensfördelar."], "model": "Strategi är planen för hur målen ska nås, men framtiden är osäker. Mintzberg menar att strategi handlar om att se mönster i det som faktiskt händer och dra slutsatser av det, snarare än att i förväg räkna ut allt. Eftersom förändringstakten ökar måste strategier vara flexibla, och organisationer behöver dynamisk förmåga och ibland improvisation. En bra strategi är långsiktig men öppen för justeringar och samstämmig med vision och mål, annars leder den åt fel håll. Den bör också vara synkad med omvärldens förändringar, ta vara på framtida möjligheter, spegla ledningens värderingar och syn på resurserna och ge konkurrensfördelar.", "topic": "k1-strat", "level": "Förklara"}, {"q": "Varför måste organisationer förändras, och varför är det klokt att förändra sig innan man tvingas till det? Ge exempel på förändringar i omvärlden och använd minst ett av fallen Kodak, Lego, Nike eller Stora. Resonera också om vad som gör det svårt att förändras i tid.", "parts": ["Organisationer är aldrig färdiga: de måste hålla takt med kraven från kunder och andra grupper, och framgång i dag garanterar inte framgång i morgon.", "Flera förändringar i omvärlden, till exempel ny teknik, nya konkurrenter, ändrade kundkrav, avregleringar, globalisering, digitalisering, åldrande befolkning och hållbarhet.", "Ett fall används och kopplas till förnyelse eller nedgång, till exempel Kodak som inte ställde om, eller Lego, Nike och Stora som förnyade sig.", "Kopplar till livscykeln: utan förnyelse väntar stagnation och nedgång, men livscykeln är inget öde utan beror på ledningen.", "Förklarar varför man bör förändra sig i tid, till exempel med Jack Welch: när förändringstakten inne är lägre än utanför är slutet nära.", "Resonerar om svårigheter, till exempel att framtiden är osäker eller att mogna och stela organisationer blir tröga.", "Drar en egen, motiverad slutsats, till exempel om flexibla strategier och dynamisk förmåga."], "model": "Organisationer är aldrig färdiga. De måste hålla takt med kraven från kunder och andra grupper, och framgång i dag garanterar inte framgång i morgon, den kan till och med vara en farlig vägvisare. Omvärlden förändras genom ny teknik, nya konkurrenter, ändrade kundkrav och avregleringar, som på skol-, vård- och apoteksmarknaden, och genom trender som globalisering, digitalisering, en åldrande befolkning och hållbarhet. Den som väntar tills den tvingas kan hamna för långt efter. Kodak dominerade filmmarknaden men ställde inte om till digital fotografi trots att utvecklingen var känd, och ansökte om konkursskydd 2012. Lego visar motsatsen: en ny ledare vände krisen genom att gå tillbaka till kärnan, och Stora har förnyat sig i omkring 700 år. Livscykeln är alltså inget öde. Jack Welch menar att när förändringstakten inne i organisationen är lägre än utanför är slutet nära. Samtidigt är det svårt: framtiden är osäker, och mogna organisationer byråkratiseras och blir tröga. Därför behöver organisationer flexibla strategier och dynamisk förmåga, och bevaka trender så att de kan ligga steget före.", "topic": "k1-strat", "level": "Resonera"}]}, {"id": "k2-match", "ch": 2, "kind": "match", "title": "Matcha: intressenter, ansvar och etik", "desc": "Intressenter, CSR, etik och etiskt ledarskap.", "rounds": [{"pairs": [["Intressent", "En part som har ett intresse i och ett utbyte med organisationen.", "k2-int"], ["Primära intressenter", "De viktigaste, utan dem fungerar inte verksamheten.", "k2-int"], ["Sekundära intressenter", "Har en svagare koppling men kan ändå påverka.", "k2-int"], ["License to operate", "Ett slags mandat från omgivningen att få verka.", "k2-ansvar"], ["CSR", "Organisationens frivilliga samhällsansvar utöver vad lagen kräver.", "k2-csr"]], "title": "Omgång 1"}, {"pairs": [["Uppförandekod", "Riktlinjer för hur man ska agera miljömässigt, socialt, etiskt och ekonomiskt riktigt.", "k2-ansvar"], ["Visselblåsare", "En person som avslöjar oetiska förhållanden i den egna organisationen, ofta via media.", "k2-etik"], ["Etiskt dilemma", "En situation där olika värden står mot varandra och inget svar är självklart.", "k2-etik"], ["Symbios", "Samlevnad, som mellan en organisation och dess omgivning.", "k2-ansvar"]], "title": "Omgång 2"}, {"title": "Omgång 3: etiskt ledarskap", "pairs": [["Trovärdighet", "Gör det du säger.", "k2-etik"], ["Ansvar", "Håll dina löften och möt de förväntningar andra har.", "k2-etik"], ["Omtanke", "Bry dig om andra och var juste.", "k2-etik"], ["Respekt", "Behandla alla med respekt.", "k2-etik"], ["Rättvisa", "Behandla alla lika och favorisera ingen.", "k2-etik"], ["Medborgarskap", "Ge mer än du tar av samhället.", "k2-etik"]]}]}, {"id": "k2-order", "ch": 2, "kind": "order", "title": "Ordna: synen på ansvar och Enron", "desc": "Aktieägar- och intressentmodellen samt Enron.", "rounds": [{"prompt": "Ordna synen på företagets ansvar i tidsordning.", "first": "Tidigast", "last": "Senast", "items": [["Aktieägarmodellen dominerar: företaget ska skapa vinst åt ägarna", "k2-int"], ["Intressentmodellen växer fram från 1970-talet", "k2-int"], ["Sedan millennieskiftet ökar kraven på socialt och miljömässigt ansvar", "k2-ansvar"]]}, {"prompt": "Ordna händelserna i Enron-skandalen från orsak till följd.", "first": "Först", "last": "Sist", "items": [["Omfattande redovisningsbedrägerier", "k2-ansvar"], ["Företaget kollapsar och går i konkurs", "k2-ansvar"], ["Tusentals anställda förlorar jobb och pensionspengar", "k2-ansvar"], ["Hårdare lagstiftning och kontroll av bolags redovisning", "k2-ansvar"]]}]}, {"id": "k2-sort", "ch": 2, "kind": "sort", "title": "Sortera: intressenter och CSR-pelare", "desc": "Primära och sekundära intressenter, CSR-pelare.", "rounds": [{"prompt": "Är det en primär eller sekundär intressent för en skola?", "cats": ["Primär", "Sekundär"], "items": [["Elever", 0, "k2-int"], ["Lärare", 0, "k2-int"], ["Övrig personal", 0, "k2-int"], ["Föräldrar", 1, "k2-int"], ["Politiker", 1, "k2-int"], ["Skattebetalare", 1, "k2-int"], ["Framtida arbetsgivare", 1, "k2-int"]]}, {"prompt": "Vilken av CSR:s tre grundpelare hör exemplet till?", "cats": ["Ekonomisk", "Ekologisk", "Social"], "items": [["Lönsamhet", 0, "k2-csr"], ["Långsiktig avkastning till ägarna", 0, "k2-csr"], ["Motverka korruption", 0, "k2-csr"], ["Minska miljöpåverkan", 1, "k2-csr"], ["Hushålla med resurser", 1, "k2-csr"], ["Livscykelperspektiv på produkter", 1, "k2-csr"], ["Goda arbetsvillkor", 2, "k2-csr"], ["Mänskliga rättigheter", 2, "k2-csr"], ["Mångfald och jämställdhet", 2, "k2-csr"], ["Inte använda barnarbete", 2, "k2-csr"]]}]}, {"id": "k2-tf", "ch": 2, "kind": "tf", "title": "Sant eller falskt: ansvar och etik", "desc": "Fem påståenden, välj sant eller falskt och rätt motivering.", "items": [{"s": "CSR innebär att företaget följer de lagar som gäller, och inget mer.", "v": false, "topic": "k2-csr", "why": ["CSR är ett frivilligt ansvar som organisationen tar utöver vad lagen kräver.", "CSR handlar bara om att öka vinsten för ägarna.", "CSR gäller bara offentliga myndigheter."]}, {"s": "I intressentmodellen bidrar varje intressent med något och förväntar sig något tillbaka.", "v": true, "topic": "k2-int", "why": ["Relationen är ett utbyte, och ledningen balanserar kraven så att alla vill fortsätta bidra.", "Intressenterna ger utan att förvänta sig något.", "Det är bara ägarna som räknas som intressenter."]}, {"s": "Föräldrar är primära intressenter för en skola.", "v": false, "topic": "k2-int", "why": ["Föräldrar har en svagare koppling men kan påverka, och är därför sekundära intressenter.", "Föräldrar är inga intressenter alls.", "Bara politiker kan vara intressenter för en skola."]}, {"s": "Enron-skandalen ledde till hårdare lagstiftning och kontroll av bolags redovisning.", "v": true, "topic": "k2-ansvar", "why": ["Efter redovisningsbedrägerierna och konkursen skärptes kontrollen av hur bolag redovisar.", "Enron gick bra och blev ett föredöme för andra företag.", "Skandalen påverkade bara Enrons ägare."]}, {"s": "Medborgarskap som grundpelare i etiskt ledarskap betyder att man ger mer än man tar av samhället.", "v": true, "topic": "k2-etik", "why": ["Medborgarskap handlar om att bidra till samhället, inte bara ta.", "Medborgarskap betyder att ledaren måste vara svensk medborgare.", "Medborgarskap betyder att man behandlar alla lika."]}]}, {"id": "k2-quiz", "ch": 2, "kind": "quiz", "title": "Flerval: intressenter, CSR och etik", "desc": "Nio flervalsfrågor och tre begrepp att skriva.", "items": [{"t": "mc", "q": "Vad innebär aktieägarmodellen?", "opts": ["Företagets uppgift är att skapa vinst åt ägarna", "Ledningen ska balansera många intressenters krav", "Företaget ska ta frivilligt samhällsansvar", "De anställda äger alltid företaget"], "why": "Kritiken är att modellen ser företaget som isolerat från samhället.", "topic": "k2-int"}, {"t": "mc", "q": "Vad blir ledningens uppgift i intressentmodellen?", "opts": ["Att balansera intressenternas krav så att alla vill fortsätta bidra", "Att bara tjäna ägarna", "Att låta kunderna bestämma allt", "Att undvika kontakt med omgivningen"], "why": "Varje intressent bidrar med något och förväntar sig något tillbaka.", "topic": "k2-int"}, {"t": "mc", "q": "Vilka är primära intressenter för en skola?", "opts": ["Elever och lärare", "Föräldrar och politiker", "Skattebetalare och framtida arbetsgivare", "Föräldrar och framtida arbetsgivare"], "why": "Utan elever och personal fungerar inte skolan. Föräldrar och politiker är sekundära intressenter.", "topic": "k2-int"}, {"t": "mc", "q": "Vad betyder license to operate?", "opts": ["Ett slags mandat från omgivningen att få verka", "Ett tillstånd att slippa skatt", "Ett körkort för företagsledare", "En licens att sälja utomlands"], "why": "Organisationer lever i symbios med sin omgivning.", "topic": "k2-ansvar"}, {"t": "mc", "q": "Vad visar Enron-skandalen?", "opts": ["Att förlorat förtroende kan fälla ett helt företag", "Att redovisningsfusk sällan upptäcks", "Att stora företag alltid överlever skandaler", "Att revisionsbyråer aldrig påverkas"], "why": "Tusentals anställda förlorade jobb och pensionspengar, och revisionsbyrån Arthur Andersen gick också under. Följden blev hårdare kontroll av redovisning.", "topic": "k2-ansvar"}, {"t": "mc", "q": "Vad innebär CSR?", "opts": ["Organisationens frivilliga samhällsansvar utöver vad lagen kräver", "Lagar som alla företag måste följa", "Ett system för att räkna ut vinsten", "En avdelning för marknadsföring"], "why": "CSR står för Corporate Social Responsibility.", "topic": "k2-csr"}, {"t": "mc", "q": "Vilka är CSR:s tre grundpelare?", "opts": ["Ekonomisk, ekologisk och social hållbarhet", "Vinst, tillväxt och marknadsandelar", "Kunder, anställda och ägare", "Vision, mål och strategi"], "why": "Grunden är hållbar utveckling.", "topic": "k2-csr"}, {"t": "mc", "q": "Varför arbetar H&M med arbetsvillkoren i fabriker som företaget inte äger?", "opts": ["Kläderna tillverkas av underleverantörer, och H&M vill använda sin storlek för att påverka i hållbar riktning", "Lagen kräver att H&M äger alla fabriker", "H&M vill sänka lönerna i fabrikerna", "Fabrikerna ägs av H&M:s kunder"], "why": "H&M har en uppförandekod för leverantörerna och arbetar med inspektioner.", "topic": "k2-ansvar"}, {"t": "mc", "q": "Vilken grundpelare i etiskt ledarskap handlar om att behandla alla lika och inte favorisera någon?", "opts": ["Rättvisa", "Omtanke", "Trovärdighet", "Medborgarskap"], "why": "Trovärdighet betyder att man gör det man säger, och medborgarskap att man ger mer än man tar av samhället.", "topic": "k2-etik"}, {"t": "txt", "q": "Den modell som dominerade fram till ungefär 1970-talet, där företagets uppgift är att skapa vinst åt ägarna.", "a": ["aktieägarmodellen", "aktieägarmodell", "aktieägar-modellen"], "shown": "Aktieägarmodellen", "how": "Den ersattes alltmer av intressentmodellen, där ledningen balanserar många intressenters krav.", "topic": "k2-int"}, {"t": "txt", "q": "Att tillgodose dagens behov utan att äventyra kommande generationers möjligheter att tillgodose sina.", "a": ["hållbar utveckling", "hållbarutveckling", "en hållbar utveckling"], "shown": "Hållbar utveckling", "how": "Det är grunden för CSR och dess tre grundpelare.", "topic": "k2-csr"}, {"t": "txt", "q": "Läran om moral, alltså om vad som är rätt och fel.", "a": ["etik", "etiken"], "shown": "Etik", "how": "Affärsetik handlar om att reflektera över rätt och fel i arbetslivet.", "topic": "k2-etik"}]}, {"id": "k2-write", "ch": 2, "kind": "write", "title": "Skriv: den ansvarstagande organisationen", "desc": "Fem skrivfrågor, bland annat ett etiskt dilemma.", "items": [{"q": "Vad är en intressent? Förklara skillnaden mellan primära och sekundära intressenter och ge minst ett exempel på vardera för en skola.", "parts": ["Intressent: en part med intresse i och utbyte med organisationen, den bidrar med något och förväntar sig något tillbaka.", "Primära intressenter är de viktigaste, utan dem fungerar inte verksamheten. Sekundära har svagare koppling men kan påverka.", "Exempel för en skola: elever och lärare är primära, till exempel föräldrar, politiker eller skattebetalare är sekundära."], "model": "En intressent är en part som har ett intresse i och ett utbyte med organisationen. Den bidrar med något och förväntar sig något tillbaka. Primära intressenter är de viktigaste, utan dem fungerar inte verksamheten. För en skola är det eleverna och lärarna och den övriga personalen. Sekundära intressenter har en svagare koppling men kan ändå påverka, för en skola till exempel föräldrar, politiker, skattebetalare och framtida arbetsgivare.", "topic": "k2-int", "level": "Kortsvar"}, {"q": "Vad står förkortningen CSR för och vad innebär det? Nämn de tre grundpelarna och ge ett exempel på vad var och en kan handla om.", "parts": ["CSR: Corporate Social Responsibility, företagets samhällsansvar på frivillig grund utöver lagkraven, med hållbar utveckling som grund.", "Ekonomisk hållbarhet, till exempel lönsamhet, långsiktig avkastning och att motverka korruption.", "Ekologisk hållbarhet, till exempel minskad miljöpåverkan och att hushålla med resurser.", "Social hållbarhet, till exempel goda arbetsvillkor, mänskliga rättigheter, jämställdhet och inget barnarbete."], "model": "CSR står för Corporate Social Responsibility, företagets samhällsansvar. Det är ett ansvar som organisationen tar frivilligt, utöver vad lagen kräver, och grunden är hållbar utveckling: att tillgodose dagens behov utan att äventyra kommande generationers möjligheter. Ekonomisk hållbarhet handlar om lönsamhet, långsiktig avkastning till ägarna och en ansvarsfull affärsetik där man motverkar korruption. Ekologisk hållbarhet handlar om att minska miljöpåverkan, hushålla med resurser och se till produkternas hela livscykel. Social hållbarhet handlar om goda arbetsvillkor, mänskliga rättigheter, mångfald och jämställdhet och om att inte använda barnarbete.", "topic": "k2-csr", "level": "Kortsvar"}, {"q": "Förklara skillnaden mellan aktieägarmodellen och intressentmodellen. Vad blir ledningens uppgift i respektive modell, och vad menas med att en organisation behöver en license to operate?", "parts": ["Aktieägarmodellen: företagets uppgift är vinst åt ägarna, dominerade till ungefär 1970-talet, kritiseras för att se företaget som isolerat.", "Intressentmodellen: företaget i ett nät av intressenter som bidrar med något och förväntar sig något tillbaka, ett utbyte.", "Ledningens uppgift: sköta företaget åt ägarna, respektive balansera intressenternas krav så att alla vill fortsätta bidra.", "License to operate: ett slags mandat från omgivningen att få verka, organisationen lever i symbios med omgivningen."], "model": "Aktieägarmodellen dominerade fram till ungefär 1970-talet. Företagets uppgift är att skapa vinst åt ägarna, och ledningen ska sköta företaget åt aktieägarna. Kritiken är att företaget ses som isolerat från samhället. Intressentmodellen växte fram från 1970-talet och placerar företaget i ett nät av intressenter, som kunder, anställda, ägare, leverantörer, stat och kommun och partners. Var och en bidrar med något och förväntar sig något tillbaka. Ledningens uppgift blir att balansera kraven så att alla vill fortsätta bidra. Organisationer lever i symbios med omgivningen och behöver ett slags mandat från den för att få verka, en license to operate.", "topic": "k2-int", "level": "Förklara"}, {"q": "Etiskt ledarskap bygger på sex grundpelare. Nämn alla sex och förklara kort vad var och en innebär.", "parts": ["Trovärdighet: gör det du säger.", "Ansvar: håll dina löften och möt de förväntningar andra har.", "Omtanke: bry dig om andra och var juste.", "Respekt: behandla alla med respekt.", "Rättvisa: behandla alla lika och favorisera ingen.", "Medborgarskap: ge mer än du tar av samhället."], "model": "Trovärdighet betyder att man gör det man säger, så att ord och handling hänger ihop. Ansvar betyder att man håller sina löften och möter de förväntningar andra har. Omtanke betyder att man bryr sig om andra och är juste. Respekt betyder att man behandlar alla med respekt. Rättvisa betyder att man behandlar alla lika och inte favoriserar någon. Medborgarskap betyder att man ger mer än man tar av samhället.", "topic": "k2-etik", "level": "Förklara"}, {"q": "Etiskt dilemma. Du har sommarjobb i en butik och trivs bra med en kollega. Efter ett tag märker du att kollegan ofta tar med sig varor och material hem utan lov. Förklara vad ett etiskt dilemma är och varför det här är ett sådant. Resonera om minst två sätt att agera med hjälp av hjälpfrågorna: Är jag bekväm med att andra får veta hur jag har gjort? Vilka effekter får beslutet? Vem påverkas? Kommer de berörda att uppfatta det som rätt och rättvist? Förklara också vad en visselblåsare är, och ta ställning till hur du borde agera.", "parts": ["Etiskt dilemma: olika värden står mot varandra och inget svar är självklart, här lojalitet mot kollegan mot ärlighet och ansvar mot arbetsgivaren.", "Minst två handlingsalternativ, till exempel att tiga, prata med kollegan eller prata med chefen.", "Använder hjälpfrågorna konkret: om du är bekväm med att andra får veta, och vilka effekter beslutet får.", "Använder hjälpfrågorna om vem som påverkas (kollegan, arbetsgivaren, övriga anställda, du själv) och om de berörda skulle uppfatta beslutet som rätt och rättvist.", "Visselblåsare: en person som avslöjar oegentligheter i den egna organisationen, ofta via media, till exempel Edward Snowden, och om det kan bli aktuellt här.", "Väger för- och nackdelar och tar ställning med en tydlig motivering.", "Kopplar till affärsetik, etisk kompetens eller grundpelarna i etiskt ledarskap, till exempel ansvar, trovärdighet eller rättvisa."], "model": "Ett etiskt dilemma är en situation där olika värden står mot varandra och det inte finns något självklart rätt svar. Här står lojalitet mot en kollega jag gillar mot ärlighet och ansvar mot arbetsgivaren. Jag kan tiga, prata med kollegan eller gå till chefen. Om jag tiger skulle jag inte vara bekväm med att andra fick veta det, och butiken fortsätter att förlora pengar. Om jag pratar med kollegan först får hen en chans att sluta, och förtroendet mellan oss kan klara det. Om jag går direkt till chefen kan kollegan förlora jobbet, men arbetsgivaren och de andra anställda skulle troligen uppfatta det som rätt och rättvist. En visselblåsare är en person som avslöjar oegentligheter i den egna organisationen, ofta via media, som Edward Snowden. Här är det rimligare att först lösa saken internt, men om stölderna fortsätter bör jag berätta för chefen. Att reflektera över rätt och fel på jobbet kallas affärsetik, och organisationer behöver etisk kompetens för att upptäcka och hantera sådana frågor.", "topic": "k2-etik", "level": "Resonera"}]}, {"id": "k3-match", "ch": 3, "kind": "match", "title": "Matcha: organisationsskolor och modeller", "desc": "Organisationsskolor, människosyn och hybrid.", "rounds": [{"pairs": [["Byråkratiska skolan", "Teori som beskriver organisationen som en maskin med regler och hierarki.", "k3-hist"], ["Scientific Management", "Vetenskaplig företagsledning: det mest effektiva sättet att utföra varje arbetsmoment.", "k3-hist"], ["Mekanisk människosyn", "Människan som en kugge som e beslut", 0, "k3-byr"], ["Kontroll uppifrån", 0, "k3-byr"], ["Kommunikation uppifrån och ner", 0, "k3-byr"], ["Ackordslön", 0, "k3-byr"], ["Styrning genom råd och mål", 1, "k3-org"], ["Låg formalisering", 1, "k3-org"], ["Bred och varierad arbetsdelning", 1, "k3-org"], ["Decentraliserade beslut", 1, "k3-org"], ["Egen kontroll", 1, "k3-org"], ["Kommunikation åt alla håll", 1, "k3-org"], ["Mer än lönen motiverar", 1, "k3-org"]]}]}, {"id": "k3-tf", "ch": 3, "kind": "tf", "title": "Sant eller falskt: förr och nu", "desc": "Fem påståenden, välj sant eller falskt och rätt motivering.", "items": [{"s": "Taylor kallas teoretikern och Weber praktikern.", "v": false, "topic": "k3-hist", "why": ["Det är tvärtom: sociologen Weber kallas teoretikern och ingenjören Taylor praktikern.", "Båda kallas praktiker eftersom de arbetade i fabriker.", "Ingen av dem hade med organisationsteori att göra."]}, {"s": "Byråkratiska principer kan ha positiva värden, till exempel likabehandling och rättssäkerhet.", "v": true, "topic": "k3-byr", "why": ["Hos myndigheter där alla ska behandlas lika är ordning och förutsägbarhet viktiga.", "Byråkrati är alltid negativt och bör undvikas.", "Likabehandling hör bara till den organiska modellen."]}, {"s": "I den organiska modellen fattas besluten högst upp i hierarkin.", "v": false, "topic": "k3-org", "why": ["Den organiska modellen bygger på decentralisering: beslut flyttas ut till dem som har kunskapen och är nära kunderna.", "I den organiska modellen fattas inga beslut alls.", "Besluten fattas av kunderna."]}, {"s": "Anpassningsproblemet innebär att reglerna blir viktigare än individen och verksamheten.", "v": true, "topic": "k3-krit", "why": ["Då blir det svårt att lära av misstag, förnya sig och anpassa sig till förändringar.", "Problemet är att organisationen anpassar sig för snabbt.", "Problemet är att det finns för få regler."]}, {"s": "Henry Ford gjorde bilen så dyr att bara rika kunde köpa den.", "v": false, "topic": "k3-hist", "why": ["Med de function totals(chN){var t=0,m=0,d=0,n=0;EX.forEach(function(ex){if(chN&&ex.ch!==chN)return;n++;var mx=maxPts(ex);m+=mx;var sc=exScore(ex);if(sc!==null){t+=sc;d++;}});return {t:t,m:m,d:d,n:n};}
function topicStats(){var o={};EX.forEach(function(ex){var s=peekS(ex);if(!s||!isGraded(ex,s))return;units(ex,s).forEach(function(u){var x=o[u.t]||(o[u.t]={p:0,m:0,ex:{}});x.p+=u.p;x.m+=u.m;x.ex[ex.id]=1;});});return o;}
function levelInfo(){var T=totals(),p=T.m?T.t/T.m:0,i=0;LEVELS.forEach(function(l,k){if(p>=l[0])i=k;});return {name:LEVELS[i][1],ico:LEVELS[i][2],p:p,next:LEVELS[i+1]||null,T:T};}

 m.className="chip"+(isProv()?" mode-prov":"");m.textContent=isProv()?(submitted()?"📝 Prov inlämnat":"📝 Provläge"):"🎯 Övningsläge";

}

function say(t){var el=document.getElementById("live");el.textContent="";setTimeout(function(){el.textContent=t;},40);}

/* ---------- Startsida ---------- */
function exStatus(ex){
 var s=peekS(ex),mx=maxPts(ex);
 if(s&&isGraded(ex,s)){var sc=score(ex,s);return '<span class="st done">'+sc+'/'+mx+' p</span> '+starsHtml(stars(sc,mx));}
 var a=answered(ex,s),q=qCount(ex);
 if(a>0)return '<span class="st part">'+a+' av '+q+'</span>';
 return '<span class="st">'+mx+' p</span>';
}

 lines.push("Utskrivet: "+new Date().toLocaleString("sv-SE"));
 lines.push("Totalt: "+T.t+" av "+T.m+" p ("+pct(T.t,T.m)+" %), "+T.d+" av "+T.n+" övningar rättade");
 CH.forEach(function(c){var t=totals(c.n);lines.push("Kapitel "+c.n+" "+c.title+": "+t.t+" av "+t.m+" p, "+t.d+" av "+t.n+" övningar");});
 var st=[],we=[];Object.keys(TOP).forEach(function(k){var x=ts[k];if(!x)return;var r=x.p/x.m;if(r>=.8)st.push(TOP[k].label);else if(r<.5)we.push(TOP[k].label);});
 lines.push("Starka områden: "+(st.join("; ")||"inga ännu"));lines.push("Att repetera: "+(we.join("; ")||"inga"));
 EX.forEach(function(ex){var sc=exScore(ex);lines.push("  Kap "+ex.ch+", "+ex.title+": "+(sc===null?"ej rättad":sc+" av "+maxPts(ex)+" p"));});
 return lines.join("\n");
}
function renderResult(){
 var T=totals(),ts=topicStats(),P=ST.m.prov;
 var h='<div class="crumb noprint"><a class="tag" href="#start">← Startsidan</a></div><h1>Resultat och sammanfattning</h1>';
 if(isProv()&&!submitted()){h+='<div class="card panel"><p><b>Provet är inte inlämnat ännu.</b> Resultatet visas när du har lämnat in provet.</p><a class="btn pri" href="#start">Till inlämningen</a></div>';app.innerHTML=h;return;}
 var wpend=EX.filter(function(ex){var s=peekS(ex);return ex.kind==="write"&&isProv()&&submitted()&&s&&score(ex,s)===0&&answered(ex,s)>0;});
 h+='<div class="card panel rhead">'+ring(T.t,T.m,160,"#D6336C",T.t+"<small> av "+T.m+" p</small>")+'<div><dl class="kv"><dt>Namn</dt><dd>'+(ST.name?esc(ST.name):'<span style="color:var(--bad)">Inget namn</span> <a class="noprint" href="#start">Ange namn</a>')+'</dd><dt>Läge</dt><dd>'+(isProv()?"Provläge, inlämnat "+esc(new Date(P.at).toLocaleString("sv-SE")):"Övningsläge")+'</dd><dt>Datum</dt><dd>'+esc(new Date().toLocaleDateString("sv-SE"))+'</dd><dt>Rättade övningar</dt><dd>'+T.d+' av '+T.n+'</dd></dl><p style="margin-top:10px">'+msg(T.m?T.t/T.m:0)+'</p><div class="row noprint" style="margin-top:8px"><button type="button" class="btn pri sm" data-act="print">🖨️ Skriv ut</button><button type="button" class="btn sec sm" data-act="copy">📋 Kopiera resultatet</button></div></div></div>';
 if(wpend.length)h+='<div class="note pink panel noprint"><b>Bedöm dina skrivsvar.</b> Kryssa i vad du har med i: '+wpend.map(function(e){return '<a href="#'+e.id+'">'+esc(e.title)+'</a>';}).join(", ")+'.</div>';
 h+='<div class="chres">';
 CH.forEach(function(c){var t=totals(c.n);h+='<div class="card '+c.color+'"><div class="chnum" style="color:var(--teal-dd)"><i style="background:var(--c)"></i>Kapitel '+c.n+'</div><h3 style="margin:4px 0 8px">'+esc(c.title)+'</h3><div class="big">'+pct(t.t,t.m)+' %</div><div class="pbar" style="margin:6px 0"><span style="width:'+pct(t.t,t.m)+'%;background:var(--c)"></span></div><div class="pmeta"><span>'+t.t+' av '+t.m+' p</span><span>'+t.d+'/'+t.n+' övningar</span></div></div>';});
 h+='</div>';
 var keys=Object.keys(TOP).filter(function(k){return ts[k];});
 var strong=keys.filter(function(k){return ts[k].p/ts[k].m>=.8;}),weak=keys.filter(function(k){return ts[k].p/ts[k].m<.5;});
 h+='<div class="cols2"><div class="card"><h2>💪 Starka områden</h2>'+(strong.length?strong.map(function(k){return '<span class="pill s">'+esc(TOP[k].label)+'</span>';}).join(""):'<p class="instr">Inga ännu. Fortsätt öva!</p>')+'</div><div class="card"><h2>🔁 Att repetera</h2>'+(weak.length?weak.map(function(k){return '<span class="pill w">'+esc(TOP[k].label)+'</span>';}).join(""):'<p class="instr">'+(keys.length?"Inget område under 50 %. Bra!":"Rätta några övningar först.")+'</p>')+'</div></div>';
 h+='<div class="card panel"><h2>Områden per kapitel</h2>';
 if(!keys.length)h+='<p class="instr">Här visas hur det går inom varje område när du har rättat övningar.</p>';
 CH.forEach(function(c){var ks=keys.filter(function(k){return TOP[k].ch===c.n;});if(!ks.length)return;
  h+='<h3 style="margin:14px 0 4px">Kapitel '+c.n+'</h3><ul class="tlist">';
  ks.forEach(function(k){var x=ts[k],r=x.p/x.m,b=r>=.8?["s","Stark"]:r>=.5?["m","På gång"]:["w","Repetera"];
   var links=Object.keys(x.ex).map(function(id){return '<a href="#'+id+'">'+esc(exById(id).title)+'</a>';}).join(", ");
   h+='<li><span class="tl">'+esc(TOP[k].label)+'<small>'+x.p+' av '+x.m+' p'+(r<.8?' · <span class="noprint">Öva: '+links+'</span>':'')+'</small></span><span class="pbar" aria-hidden="true"><span style="width:'+Math.round(r*100)+'%;background:'+(r>=.8?"var(--ok)":r>=.5?"var(--yel)":"var(--bad)")+'"></span></span><span class="badge '+b[0]+'">'+b[1]+' '+Math.round(r*100)+' %</span></li>';});
  h+='</ul>';});
 h+='</div><details class="copy"><summary>Visa resultatet som text</summary><pre id="sumtxt">'+esc(summaryText())+'</pre></details>';
 app.innerHTML=h;
 if(T.m&&T.t/T.m>=.9&&!renderResult._c){renderResult._c=1;confetti();}
}
/* ---------- Routing ---------- */
function route(keep){
 var id=(location.hash||"").replace(/^#\/?/,""),ex=exById(id),y=window.scrollY;
 SEL=keep?SEL:null;
 if(id==="resultat")renderResult();else if(ex)renderEx(ex);else renderStart();
 updateBar();
 if(keep){window.scrollTo({top:y,left:0,behavior:"instant"});if(FK){var el=app.querySelector('[data-fk="'+FK+'"]');if(el&&!el.disabled)el.focus({preventScroll:true});}}
 else{window.scrollTo({top:0,left:0,behavior:"instant"});if(id)app.focus({preventScroll:true});}
 FK=null;window._mv=null;window._nb=null;
}
function cur(){return exById((location.hash||"").replace(/^#\/?/,""));}
function lockMaybe(ex,s,key){if(!isProv())s.lock[key]=1;}
function gradeEx(ex,s){s.graded=true;var sc=score(ex,s),mx=maxPts(ex);var old=ST.best[ex.id];if(old===undefined||sc>old){ST.best[ex.id]=sc;if(old!==undefined&&sc>old)window._nb=ex.id;}save();say("Rättat: "+sc+" av "+mx+" poäng.");if(sc>=mx&&ex.kind!=="write")confetti();}
app.addEventListener("click",function(e){
 var t=e.target.closest?e.target.closest("[data-act]"):null;if(!t||t.tagName==="INPUT")return;
 var act=t.getAttribute("data-act"),ex=cur(),s=ex?getS(ex):null;
 if(act==="mode"){var v=t.getAttribute("data-v");if(v===ST.mode)return;
  if(v==="ovning"&&!submitted()&&Object.keys(ST.m.prov.ex).some(function(id){return answered(exById(id),ST.m.prov.ex[id])>0;})){
   if(!window.confirm("Om du byter till övningsläget avbryts provet och dina provsvar raderas. Vill du fortsätta?"))return;ST.m.prov={ex:{},submitted:false,at:null,started:null};}
  ST.mode=v;save();route();say(v==="prov"?"Provläge valt":"Övningsläge valt");return;}
 if(act==="submit"){if(!t.getAttribute("data-sure")){t.setAttribute("data-sure","1");t.textContent="Klicka igen för att lämna in";toast("Klicka en gång till för att lämna in provet.");return;}
  ST.m.prov.submitted=true;ST.m.prov.at=Date.now();save();location.hash="resultat";route();toast("Provet är inlämnat.");return;}
 if(act==="reset"){if(!t.getAttribute("data-sure")){t.setAttribute("data-sure","1");t.textContent="Klicka igen för att bekräfta";return;}
  if(isProv())ST.m.prov={ex:{},submitted:false,at:null,started:null};else{ST.m.ovning={ex:{}};ST.best={};}save();route();toast("Nollställt.");return;}
 if(act==="print"){window.print();return;}
 if(act==="copy"){copyRes();return;}
 if(!ex)return;var g=isGraded(ex,s),r=Number(t.getAttribute("data-r")),i=Number(t.getAttribute("data-i"));
 if(act==="grade"){gradeEx(ex,s);route();var rc=document.getElementById("exres");if(rc)rc.scrollIntoView({block:"start",behavior:reduced()?"auto":"smooth"});return;}
 if(act==="redo"){delete ST.m.ovning.ex[ex.id];save();route();return;}
 if(g)return;
 if(act==="mt"){var key=r+"_"+i;SEL=SEL===key?null:key;FK="mt"+key;route(true);return;}
 if(act==="md"){var k=t.getAttribute("data-k"),rr=ex.rounds[r];rr.pairs.forEach(function(p,j){if(String(s.ans["m"+r+"_"+j])===k)delete s.ans["m"+r+"_"+j];});
  if(SEL&&Number(SEL.split("_")[0])===r){var pi=SEL.split("_")[1];s.ans["m"+r+"_"+pi]=Number(k);say("Kopplade "+rr.pairs[pi][0]);SEL=null;
   var nx=rr.pairs.map(function(p,j){return j;}).filter(function(j){return !has(s.ans["m"+r+"_"+j]);})[0];FK=nx!==undefined?"mt"+r+"_"+nx:"md"+r+"_"+k;}
  else FK="md"+r+"_"+k;save();route(true);return;}
 if(act==="up"||act==="down"){var arr=s.ans["o"+r],p=Number(t.getAttribute("data-p")),q=act==="up"?p-1:p+1;if(q<0||q>=arr.length)return;var tmp=arr[p];arr[p]=arr[q];arr[q]=tmp;s.ans["ot"+r]=1;window._mv=r+"_"+tmp;
  FK=(act==="up"?(q===0?"dn":"up"):(q===arr.length-1?"up":"dn"))+r+"_"+tmp;save();route(true);return;}
 if(act==="cat"){s.ans["s"+r+"_"+i]=Number(t.getAttribute("data-c"));FK=t.getAttribute("data-fk");save();route(true);return;}
 if(act==="tfv"){s.ans["v"+i]=t.getAttribute("data-v");if(has(s.ans["w"+i]))lockMaybe(ex,s,"t"+i);FK=t.getAttribute("data-fk");save();route(true);return;}
 if(act==="chk"){if(String(s.ans["q"+i]||"").trim()==="")return toast("Skriv ett svar först.");lockMaybe(ex,s,"q"+i);FK="tx"+(i+1);save();route(true);return;}
});
app.addEventListener("change",function(e){
 var t=e.target,act=t.getAttribute("data-act"),ex=cur();if(!ex||!act)return;var s=getS(ex),i=Number(t.getAttribute("data-i"));
 if(act==="mc"){if(isGraded(ex,s)||s.lock["q"+i])return;s.ans["q"+i]=Number(t.value);lockMaybe(ex,s,"q"+i);FK=t.getAttribute("data-fk");save();route(true);if(!isProv())say(Number(t.value)===0?"Rätt":"Inte riktigt");return;}
 if(act==="tfw"){if(isGraded(ex,s)||s.lock["t"+i])return;s.ans["w"+i]=Number(t.value);if(has(s.ans["v"+i]))lockMaybe(ex,s,"t"+i);FK=t.getAttribute("data-fk");save();route(true);return;}
 if(act==="wchk"){s.ans[t.getAttribute("data-c")]=t.checked?1:0;var sc=score(ex,s);if(!isProv()){var old=ST.best[ex.id];if(old===undefined||sc>old)ST.best[ex.id]=sc;}save();var rc=document.getElementById("exres");if(rc)rc.outerHTML=resultCard(ex,s);updateBar();return;}
});
app.addEventListener("input",function(e){
 var t=e.target,act=t.getAttribute("data-act");
 if(t.id==="nm"){ST.name=t.value.trim();save();updateBar();return;}
 var ex=cur();if(!ex||!act)return;var s=getS(ex),i=Number(t.getAttribute("data-i"));
 if(act==="txt"){s.ans["q"+i]=t.value;save();updProg(ex,s);}
 if(act==="wtxt"){s.ans["w"+i]=t.value;save();var wc=document.getElementById("wc"+i),v=t.value.trim();if(wc)wc.textContent=(v?v.split(/\s+/).length:0)+" ord";updProg(ex,s);}
});
app.addEventListener("keydown",function(e){var t=e.target;if(e.key==="Enter"&&t.getAttribute&&t.getAttribute("data-act")==="txt"&&!isProv()){e.preventDefault();var b=app.querySelector('[data-act="chk"][data-i="'+t.getAttribute("data-i")+'"]');if(b)b.click();}});
function updProg(ex,s){var n=qCount(ex),a=answered(ex,s),b=app.querySelector(".prog .pbar span"),pt=app.querySelector(".prog .pt");if(b)b.style.width=(n?100*a/n:0)+"%";if(pt)pt.textContent=a+" av "+n+" besvarade";}
document.getElementById("cName").addEventListener("click",function(){location.hash="start";setTimeout(function(){var n=document.getElementById("nm");if(n)n.focus();},60);});
function copyRes(){var txt=summaryText();
 function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(x){}document.body.removeChild(ta);toast(ok?"Resultatet är kopierat.":"Kopiera texten under Visa resultatet som text.");if(!ok){var d=app.querySelector("details.copy");if(d)d.open=true;}}
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast("Resultatet är kopierat.");},fallback);else fallback();}
window.addEventListener("hashchange",function(){document.querySelectorAll(".conf").forEach(function(c){c.remove();});route();});
route();
</script>
